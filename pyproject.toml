[project]
name = "nl-json-translator"
version = "0.1.0"
description = "Standalone NL-to-JSON command translator demo inspired by ROSGPT."
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.7,<3",
    "SQLAlchemy>=2.0,<3",
]

[project.scripts]
nl-json-translator = "nl_json_translator.cli:main"
nl-json-init-db = "nl_json_translator.infrastructure.init_db:main"
nl-json-seed-demo = "nl_json_translator.infrastructure.seed_demo_data:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
