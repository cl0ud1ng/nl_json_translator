[project]
name = "nl-json-translator"
version = "0.2.0"
description = "Database-backed natural-language cargo transport order demo."
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.7,<3",
    "SQLAlchemy>=2.0,<3",
]

[project.scripts]
nl-json-translator = "nl_json_translator.cli:main"
nl-json-init-db = "nl_json_translator.infrastructure.init_db:main"
nl-json-seed-demo = "nl_json_translator.infrastructure.seed_demo_data:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nl_json_translator*"]
